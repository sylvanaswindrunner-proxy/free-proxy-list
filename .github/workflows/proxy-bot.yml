name: Update & Verify Free Proxies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-scan
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run proxy scanner and Telegram publisher
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CONCURRENCY: "2500"
          DIAL_TIMEOUT_SEC: "3"
          TIMEOUT_SEC: "8"
        run: |
          ulimit -n 65535 || true
          go run ./cmd/bot

      - name: Commit and push updated proxy lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxies/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update verified proxy lists [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
